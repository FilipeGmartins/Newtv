<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha TV Online</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>📺 NewTV Sports</h1>
    <p>Assista aos melhores canais esportivos online</p>
  </header>

  <main class="container" id="channel-list">
    <!-- Canais serão renderizados via JS -->
  </main>

  <!-- Modal Player -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <div class="channel-title" id="current-channel-title">Canal</div>
        <button id="close-btn" title="Fechar player">✖</button>
      </div>
      <iframe id="player" src="" frameborder="0" allowfullscreen sandbox="allow-same-origin allow-scripts allow-presentation"></iframe>
      <div class="modal-controls">
        <button id="prev-channel" title="Canal anterior">⬅️ Anterior</button>
        <button id="next-channel" title="Próximo canal">Próximo ➡️</button>
      </div>
    </div>
  </div>

  <script src="logos.js"></script>
  <script src="channels.js"></script>
  <script src="script.js"></script>

  <footer style="text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
    <p>© 2024 NewTV Sports - Todos os direitos reservados</p>
  </footer>
</body>
</html>
